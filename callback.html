<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Obeya board — code de connexion</title></head>
<body>
<p>Copie ce code dans le panneau Obeya d'Orca, puis ferme cet onglet. Ne le partage avec personne.</p>
<pre id="c" style="user-select:all;white-space:pre-wrap;word-break:break-all"></pre>
<script>
  // Aucune requête réseau : la page lit l'adresse, affiche le code, puis l'efface de l'URL.
  const q = new URLSearchParams(location.search);
  const out = document.getElementById('c');
  if (q.get('code') && q.get('state')) {
    const json = JSON.stringify({ code: q.get('code'), state: q.get('state') });
    out.textContent = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  } else out.textContent = 'Erreur : ' + (q.get('error') || 'retour invalide');
  history.replaceState(null, '', location.pathname);
</script>
</body></html>
